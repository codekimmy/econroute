name: daily-signal

on:
  schedule:
    - cron: "30 21 * * *"   # 매일 한국시간 06:30
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집·신호 판정
        run: python run_daily.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
      - name: 결과 저장
        run: |
          git config user.name "wes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily update"
          git push
